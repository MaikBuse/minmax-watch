# `check` mirrors the `just check` recipe. `image` builds and publishes the
# container, and only once `check` has passed on a push to `main` — the two are
# one workflow rather than two files precisely so that the ordering is enforced
# rather than coincidental.
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      # The shared crates go into the wasm client, so a change that only
      # compiles on the host is a break that would otherwise surface as a
      # failed release build rather than a failed check.
      - name: wasm-check
        run: cargo check -p overwatch-core -p overwatch-data --target wasm32-unknown-unknown

  image:
    name: image
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One tag, and deliberately no `latest`. ArgoCD Image Updater watches
      # this repository with the `newest-build` strategy, which ranks every tag
      # it finds by build time — a moving `latest` would win every comparison
      # and pin the cluster to a tag whose contents change underneath it.
      #
      # The `-amd64` suffix matches the convention the other images in the
      # cluster use. Only amd64 is built: every node is a Proxmox VM.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/maikbuse/minmax-watch:${{ github.sha }}-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
