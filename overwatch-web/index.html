<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Deliberately empty: dx appends the title from Dioxus.toml *into*
             this element, so any text here would end up duplicated. -->
        <title></title>
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta charset="UTF-8">
        <!-- Written for what a player actually types into a search box —
             "counter picks", "hero matchups" — rather than for what the app is
             proudest of. The same sentence appears in manifest.json, in the
             JSON-LD below, twice more in this file, and in docs/BRAND.md's
             string table; they are meant to be one string and drift silently. -->
        <meta name="description" content="Overwatch 2 draft assistant. Counter picks, hero matchups and team synergy, scored in your browser and shared with your team by session code.">
        <link rel="canonical" href="https://minmax.watch/">
        <meta name="theme-color" content="#0B0D11">

        <!-- Link preview. og.png is generated from og.svg by `just brand-icons`;
             absolute rather than relative because scrapers do not all resolve
             against the canonical URL. -->
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="minmax.watch">
        <meta property="og:url" content="https://minmax.watch/">
        <meta property="og:locale" content="en_US">
        <meta property="og:title" content="MinMax — Overwatch 2 draft assistant">
        <meta property="og:description" content="Overwatch 2 draft assistant. Counter picks, hero matchups and team synergy, scored in your browser and shared with your team by session code.">
        <meta property="og:image" content="https://minmax.watch/og.png">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta property="og:image:alt" content="minmax.watch — Overwatch 2 draft assistant">
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="MinMax — Overwatch 2 draft assistant">
        <meta name="twitter:description" content="Overwatch 2 draft assistant. Counter picks, hero matchups and team synergy, scored in your browser and shared with your team by session code.">
        <meta name="twitter:image" content="https://minmax.watch/og.png">
        <meta name="twitter:image:alt" content="minmax.watch — Overwatch 2 draft assistant">

        <!-- Structured data. Static rather than rendered, which is the whole
             point: it is the one description of the app that reaches a crawler
             that never runs the wasm. `GameApplication` is schema.org's own
             category value; the app is free and needs no account, so saying so
             is what `offers` and `isAccessibleForFree` are for. -->
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebApplication",
            "name": "MinMax",
            "alternateName": "minmax.watch",
            "url": "https://minmax.watch/",
            "description": "Overwatch 2 draft assistant. Counter picks, hero matchups and team synergy, scored in your browser and shared with your team by session code.",
            "applicationCategory": "GameApplication",
            "operatingSystem": "Any (web browser)",
            "browserRequirements": "Requires WebAssembly",
            "image": "https://minmax.watch/og.png",
            "inLanguage": "en",
            "isAccessibleForFree": true,
            "license": "https://opensource.org/licenses/MIT",
            "offers": {
                "@type": "Offer",
                "price": "0",
                "priceCurrency": "USD"
            }
        }
        </script>

        <link rel="manifest" href="/manifest.json">
        <!-- Served from the bundle root, not through `asset!()`: manifest.json
             references these by absolute path and cannot know the hashed ones.
             `just build-web` copies each one; anything added here has to be
             added to that recipe too or it never reaches the bundle. -->
        <link rel="icon" type="image/svg+xml" href="/icon.svg">
        <link rel="icon" href="/favicon.ico" sizes="32x32">
        <!-- iOS ignores both the manifest icons and SVG favicons; without this,
             "add to home screen" saves a screenshot of the page. -->
        <link rel="apple-touch-icon" href="/apple-touch-icon.png">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <!-- The standardised spelling of the line above; the `apple-` one stays
             for the iOS versions that only read that. -->
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-title" content="MinMax">
        <!-- `black`, not `black-translucent`. Translucent makes the installed
             web view extend *under* the status bar whatever the viewport says,
             which put the header behind the clock — and buying it back would
             mean `viewport-fit=cover` plus safe-area padding on all four sides,
             including the ~50px the notch takes in landscape, which is the
             orientation this screen actually wants. Nothing here is full-bleed,
             so there is nothing to win. This matches `theme-color`. -->
        <meta name="apple-mobile-web-app-status-bar-style" content="black">

        <!-- The UI face, self-hosted. Preloaded rather than left to the
             stylesheet: the CSS is itself a hashed asset the browser has to
             fetch and parse first, and the draft screen is text the moment it
             paints. `crossorigin` is required on a font preload even
             same-origin, or the fetch happens twice. -->
        <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
    </head>
    <body>
        <div id="main"></div>

        <!-- What fills the second or two the wasm takes to arrive.
             Deliberately a sibling *after* #main, for two reasons: Dioxus
             appends its tree into #main rather than clearing it, so a splash
             nested inside would sit under the app forever; and the rule that
             hides this one (`#main:not(:empty) ~ #boot` in style.css) uses the
             general sibling combinator, which cannot look backwards. Move it
             above #main and it never goes away.

             The mark is written out here rather than pulled from /icon.svg so
             it paints in the first frame with no request, and so it works under
             `just dev`, which does not serve the root-path assets. Same drawing
             as assets/icon.svg and ui.rs's brand_mark(); being in the page
             rather than inside an <img> it can read the palette tokens. -->
        <div id="boot">
            <svg viewBox="0 0 96 96" width="96" height="96" aria-hidden="true">
                <g fill="none" stroke-width="10" stroke-linecap="round"
                   transform="rotate(-90 48 48)">
                    <circle cx="48" cy="48" r="32" stroke="var(--role-tank)"
                            stroke-dasharray="55.85 145.2" />
                    <circle cx="48" cy="48" r="32" stroke="var(--role-damage)"
                            stroke-dasharray="55.85 145.2" stroke-dashoffset="-67.02" />
                    <circle cx="48" cy="48" r="32" stroke="var(--role-support)"
                            stroke-dasharray="55.85 145.2" stroke-dashoffset="-134.04" />
                </g>
                <g stroke="currentColor" stroke-width="8" stroke-linecap="round" fill="none">
                    <circle cx="48" cy="48" r="10" />
                    <path d="M48 30v-6M48 66v6M30 48h-6M66 48h6" />
                </g>
            </svg>
            <!-- The only prose in the document, and the only thing a crawler
                 that does not execute wasm has to go on: everything else on
                 this screen is drawn by the app after it boots. It is visible
                 rather than hidden off-screen deliberately — text that only a
                 search engine can read is the definition of cloaking, and this
                 is also simply what a loading screen ought to say.

                 The heading is repeated as a visually-hidden one inside the
                 app's own header (`.brand-heading` in ui.rs), because this
                 element is display-hidden the moment the app mounts and a
                 crawler that *does* render would otherwise find no h1 at all. -->
            <h1>MinMax <span>— Overwatch 2 draft assistant</span></h1>
            <p class="boot-blurb">
                Counter picks, hero matchups and team synergy, scored in your
                browser as hero select runs — and shared with your team by
                session code.
            </p>
            <!-- The one case where this screen is the final state rather than a
                 waiting one, so it is also the only chance to say why. Not
                 aria-hidden, unlike the mark above: this is the part a screen
                 reader should reach. -->
            <noscript>MinMax needs JavaScript to score a draft.</noscript>
        </div>

        <script>
            // Cache the shell so the app still opens when the LAN server is
            // off. Scoring is local anyway, so a cached shell is a fully
            // working single-player app rather than a degraded one.
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('/sw.js').catch(() => {
                        // Not being installable is not worth surfacing.
                    });
                });
            }
        </script>
    </body>
</html>
