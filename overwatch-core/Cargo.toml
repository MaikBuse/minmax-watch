[package]
name = "overwatch-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Pure domain model and scoring engine for the Overwatch hero picker. No I/O, wasm32-clean."

[dependencies]
