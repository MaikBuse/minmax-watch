# How much each hero prefers attacking over defending, on -100..=100.
# Positive leans attack, negative leans defend, 0 means it makes no difference.
#
# Hand-curated, like synergy.toml. No source publishes this: counterpickgg's map
# column is a single "best maps" list with no side, and counterwatch is duel data
# with no map context at all. The ingest never writes this file.
#
# These are judgement calls, not measurements. The bar for a non-zero value here
# is that the hero's kit is built around something only one side gets — setup
# time and held angles on defence, or the mobility to open a choke on attack.
# Anything less clear-cut is written down as an explicit zero with a note, which
# is why the whole roster is in this file. The loader cannot tell an absent row
# from a zero and neither can the scorer, so a hero nobody had read looked
# exactly like a hero somebody had read and found neutral — the note is the only
# thing that separates them. It only applies on Escort and Hybrid; every other
# mode starts both teams in the same posture.
#
# One piece of outside corroboration is worth having, since nothing else here
# has any: the game's own Flanker sub-role is defined as striking a backline
# rather than holding a line, and every hero this file already rated that is now
# officially a Flanker leans attack. That is a reason to trust the attack half
# below, not a rule to apply — Reaper is a Flanker and still only reaches +30,
# because Shadow Step is transport rather than an entry.

generated = "hand-curated"

