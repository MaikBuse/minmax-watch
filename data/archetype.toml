# How each hero wants the fight to happen, on three axes, 0..=100 each.
#
#   dive   — close the distance, isolate one target, kill it, leave
#   poke   — hold an angle, chip from range, refuse the close fight
#   brawl  — hold ground at short range and win the sustained fight
#
# Hand-curated, like synergy.toml and side.toml. No source publishes this: the
# scraped matchup data is pairwise duels, and a duel says nothing about the
# shape of the team the duel happens inside. The ingest never writes this file.
#
# The three numbers do not sum to anything. Most kits are genuinely strong on
# two axes — Zarya brawls but travels with a dive, Echo pokes from the air and
# dives out of it — and forcing them to a hundred would make every hero a
# specialist by arithmetic rather than by kit.
#
# The bar for a non-zero value is that the *kit* says so: an engage tool, a
# falloff range, a barrier, a cooldown that only pays off at one distance. Win
# rates and tier lists are not evidence here — they say a hero is strong, not
# how the hero wants to fight. Anything less clear-cut is left low rather than
# guessed at, and a hero absent from this file contributes nothing to its
# team's shape at all, which is the honest answer for a kit nobody has read yet.
#
# These are judgement calls. The notes are not decoration: a curated number with
# no source behind it is indistinguishable from a typo unless it says why.

